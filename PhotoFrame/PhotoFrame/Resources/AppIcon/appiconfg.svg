<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <!--
        Передний план адаптивной иконки: именно фоторамка, а не «картинка» и не монитор.
        Читаемость даёт двойной контур — толстый багет снаружи и тонкое паспарту внутри;
        подставки нет намеренно, из-за неё знак выглядел как экран на ножке.
        Графика держится в центральных ~60% полотна: Android режет иконку по маске.
    -->

    <!-- Багет рамки -->
    <rect x="142" y="112" width="172" height="232" rx="12" ry="12"
          fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linejoin="round" />

    <!-- Паспарту -->
    <rect x="172" y="142" width="112" height="172" rx="4" ry="4"
          fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round" />

    <!-- Снимок внутри: солнце и горы -->
    <circle cx="201" cy="181" r="13" fill="#FFFFFF" />
    <path d="M 179 305 L 215 251 L 241 281 L 253 265 L 278 305 Z"
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" />
</svg>
